
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante</title>

    <style>
        header {
            height: 20px;
            border: 1px solid black;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;

            h1 {
                color: #000000;
            }

            nav {
                ul {
                    font-size: 1.7rem;
                    display: flex;
                    gap: 25px;
                    list-style: none;
                }
            }
        }

        main {
            min-height: 30px;   
            border: 1px solid black;
            padding: 20px 30px;
        }

        section {
            border: 1px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 20px;
        }

        section label {
            width: 95%;
        }

        section input {
            width: 100%;
            height: 30px;
            text-align: center;
        }
    </style>
</head>

<body>

    <header>
        <h1>LOGO</h1>

        <nav>
            <ul>
                <li><a href="inicio.com">Inicio</a></li>
                <li><a href="beneficios.com">Cardápio</a></li>
                <li><a href="cadastro.com">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <label>
                <input type="text" placeholder="Buscar">
            </label>
        </section>
        <section>
            <h1>DESTAQUE</h1>
        </section>
    </main>

</body>
</html>
