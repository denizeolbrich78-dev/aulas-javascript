<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Texto animado</title>
<style>
   

    body {
        color: #ff3c00;
        font-family: Arial, sans-serif;
        text-align: center;
        height: 100vh;
        display: flex;
        justify-content: center;
        
    }
    .frase {
        font-size: 2rem;
        opacity: 0; 
        transform: translateX(-100vh); 
        animation: moverCentro 3s ease-out forwards;
    }

    
    @keyframes moverCentro {
        0% {
            transform: translateX(-100vh);
            opacity: 0;
        }
        10% {
            opacity: 1;
        }
        100% {
            transform: translateX(0);
            opacity: 1;
        }
    }
</style>
</head>
<body>
    <div class="frase">laranjinha.html</div>
</body>
</html>
